<text x="60" y="540" class="t">Rubric and rationale</text>
<text x="60" y="570" class="a">• Points are numbered 1–10 and map to the brand legend below. Scores use a 1–5 analytical rubric from observed price/positioning, official claim specificity, channel relevance and current source packet.</text>
<text x="60" y="592" class="a">• Proof strength is not a clinical quality judgment; it scores traceability/specificity visible in this audit.</text>
<text x="60" y="614" class="a">• Observed price is a dated snapshot where available; missing Thai price is treated as tier estimate and must be refreshed before decisions.</text>
<text x="60" y="636" class="a">• Same 10 brands are used across competitor matrix, Customer Voice, maps and strategic analysis.</text>
<polygon points="70,656 78,664 70,672 62,664" fill="#059669"/>
<text x="85" y="668" class="a">T / green dashed area = provisional trial target and Winning Zone; conditional on formula, proof, WTP, unit economics and Thai compliance gates.</text>
